<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While Loop</title>
</head>
<body>
    <h1>While Loop</h1>
<p id="demo"></p>

    <h2>For being used like a While Loop</h2>
    <p id="demo1"></p>
    <script>



        var text = ""
        var i = 3
        while (i < 10)
    {
        text += "The number is " + i +"<br>"
        i++
    }

    console.log(text)
    document.getElementById('demo').innerHTML = text


    const cars = ["BMW", "Volvo", "Honda", "Mazda", "Toyota", "Tesla"]


var y = 0;
var mytext = ""

while(cars[y])
{
    mytext += cars[y] + '<br>'
    y++
}
 document.getElementById('demo1').innerHTML = mytext



    </script>
    
</body>
</html>
