<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Bootstrap CSS  -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    />

    <!-- Remix Icon CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
    />
  </head>
  <body>
    <p id="apikey">This is test api</p>
    <div>
      <div class="container">
        <div class="wrapper justify-content-center">
          <div class="card">
            <div class="search">
              <input type="text" placeholder="Enter city name" />
              <button type="button" class="searchBtn">
                <i class="ri-search-line"></i>
              </button>
            </div>
            <div class="error">Please Enter Valid City</div>
            <div class="weather">
              <div id="weather-icon">
                <i class="ri-thunderstorms-line"></i>
              </div>
              <h1 class="temp">22°C</h1>
              <h2 class="city">London</h2>

              <div class="details">
                <div class="col">
                  <i class="ri-mist-fill"></i>
                  <div>
                    <p class="humidity">50%</p>
                    <p>Humidity</p>
                  </div>
                </div>
                <div class="col">
                  <i class="ri-windy-line"></i>
                  <div>
                    <p class="wind">15 km/h</p>
                    <p>Wind Speed</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. Bootstrap JavaScript Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
