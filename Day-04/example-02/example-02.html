<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Javascript Example - 02</title>
</head>
<body>

    <h1 id="demo"></h1>
    <p id="demo2"></p>

    <h3 id="mydate"></h3>
    <h3 id="mydate2"></h3>


    <script>
        var students = ['Paul', 'Faith', 'Maria', 'Adolfo', 'Clark'] 
        var fname = 'Paul'
        var doing = 'learning'  
        var i = Math.floor(Math.random() * students.length)
        var today = new Date();

        var day = today.getDate();
        var month = today.getMonth()+1;
        var year = today.getFullYear();

       
        // var formatedDate = day + '/' + month + '/' + year
        var formatedDate = month + '/'+   day    +'/' + year

          
        // document.getElementById('demo').innerHTML = 'My Name is ' + fname
        document.getElementById('demo').innerHTML = 'My Name is ' + students[i]
        document.getElementById('demo2').innerHTML = 'Im ' + doing + ' Javascript'
        document.getElementById('mydate').innerHTML = today.toDateString();
        document.getElementById('mydate2').innerHTML = formatedDate

    </script>
    
</body>
